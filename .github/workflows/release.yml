name: Publish immutable PackSet release

on:
  push:
    tags: [v*]

permissions:
  contents: read

concurrency:
  group: resourcepacks-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: release-tools/package-lock.json
      - id: release
        name: Derive exact tag, commit, and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          test -n "$version"
          test "$version" = "$(tr -d '\n' < version.txt)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Build the exact four artifacts
        run: ./gradlew --no-build-cache :resourcepacks-product:buildPackSet -PpackSetVersion='${{ steps.release.outputs.version }}' -PprovenanceCommit='${{ steps.release.outputs.commit }}' -PpublicationType=release -PpublicationId='${{ steps.release.outputs.tag }}' -PreleaseOutput="$RUNNER_TEMP/release"
      - name: Locally verify the immutable release
        run: |
          release="$RUNNER_TEMP/release"
          test "$(find "$release" -maxdepth 1 -type f | wc -l)" -eq 4
          node --input-type=module --eval 'import { readdir, readFile } from "node:fs/promises"; const manifest = JSON.parse(await readFile(process.argv[1], "utf8")); const expected = [manifest.catalog.file, ...manifest.packs.map(pack => new URL(pack.url).pathname.split("/").at(-1)), "manifest.json"].sort(); const actual = (await readdir(process.argv[2])).sort(); if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error("release artifact set mismatch"); if (manifest.version !== process.argv[3] || manifest.publication.type !== "release" || manifest.publication.id !== process.argv[4] || manifest.provenance.commit !== process.argv[5]) throw new Error("release manifest provenance mismatch");' "$release/manifest.json" "$release" '${{ steps.release.outputs.version }}' '${{ steps.release.outputs.tag }}' '${{ steps.release.outputs.commit }}'
          zipinfo -1 "$release"/grounds-content-pack-*.zip
          zipinfo -1 "$release"/grounds-platform-pack-*.zip
          zipinfo -1 "$release"/grounds-resourcepack-catalog-*.jar
      - name: Verify locked release tools
        working-directory: release-tools
        run: |
          npm ci --ignore-scripts
          npm test
          npm test
          npm audit --audit-level=high
      - name: Upload the locally verified release
        uses: actions/upload-artifact@v4
        with:
          name: immutable-packset-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: release-tools/package-lock.json
      - uses: actions/download-artifact@v5
        with:
          name: immutable-packset-release
          path: ${{ runner.temp }}/release
      - name: Install locked release tools
        working-directory: release-tools
        run: npm ci --ignore-scripts
      - name: Stage the exact Maven publication
        run: ./gradlew :resourcepacks-catalog:stageExactMavenPublication -PpackSetVersion='${{ needs.build.outputs.version }}'
      - id: maven-gate
        name: Decide whether GitHub Packages needs publication
        run: |
          decision=$(node release-tools/src/maven-create-or-compare.mjs --manifest "$RUNNER_TEMP/release/manifest.json" --staging-directory resourcepacks-catalog/build/release-maven-staging --username '${{ github.actor }}' --token '${{ secrets.GITHUB_TOKEN }}')
          case "$decision" in
            publish|skip) ;;
            *) echo "Maven decision is invalid" >&2; exit 1 ;;
          esac
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
      - name: Publish the unchanged Maven staging workspace
        if: steps.maven-gate.outputs.decision == 'publish'
        run: ./gradlew :resourcepacks-catalog:publishMavenJavaPublicationToGitHubPackagesRepository -PpackSetVersion='${{ needs.build.outputs.version }}'
      - name: Create or compare immutable R2 ZIP objects
        run: node release-tools/src/r2-create-or-compare.mjs --manifest "$RUNNER_TEMP/release/manifest.json" --release-directory "$RUNNER_TEMP/release" --bucket '${{ secrets.R2_BUCKET }}' --endpoint '${{ secrets.R2_ENDPOINT }}' --access-key '${{ secrets.R2_ACCESS_KEY_ID }}' --secret-key '${{ secrets.R2_SECRET_ACCESS_KEY }}'

  public-cdn:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: release-tools/package-lock.json
      - uses: actions/download-artifact@v5
        with:
          name: immutable-packset-release
          path: ${{ runner.temp }}/release
      - name: Verify public CDN bytes without production credentials
        run: node release-tools/src/verify-cdn.mjs --manifest "$RUNNER_TEMP/release/manifest.json" --release-directory "$RUNNER_TEMP/release" --base-url https://cdn.grounds.gg

  release-assets:
    needs: [build, public-cdn]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: release-tools/package-lock.json
      - uses: actions/download-artifact@v5
        with:
          name: immutable-packset-release
          path: ${{ runner.temp }}/release
      - name: Attach only byte-identical release assets
        env:
          EXPECTED_TAG: ${{ needs.build.outputs.tag }}
          TRIGGER_TAG: ${{ github.ref_name }}
        run: |
          test "$EXPECTED_TAG" = "$TRIGGER_TAG"
          node release-tools/src/release-assets-create-or-compare.mjs --manifest "$RUNNER_TEMP/release/manifest.json" --release-directory "$RUNNER_TEMP/release" --token '${{ secrets.GITHUB_TOKEN }}'

  stable-channel:
    needs: [build, release-assets]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: release-tools/package-lock.json
      - uses: actions/download-artifact@v5
        with:
          name: immutable-packset-release
          path: ${{ runner.temp }}/release
      - name: Install locked release tools
        working-directory: release-tools
        run: npm ci --ignore-scripts
      - name: Advance Stable channel last
        run: node release-tools/src/r2-channel-advance.mjs --channel stable --manifest "$RUNNER_TEMP/release/manifest.json" --release-directory "$RUNNER_TEMP/release" --bucket '${{ secrets.R2_BUCKET }}' --endpoint '${{ secrets.R2_ENDPOINT }}' --access-key '${{ secrets.R2_ACCESS_KEY_ID }}' --secret-key '${{ secrets.R2_SECRET_ACCESS_KEY }}' --sequence '${{ github.run_number }}'
